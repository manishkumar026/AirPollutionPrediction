databases:
  - name: airwatch-db
    plan: free

services:
  - type: web
    name: airwatch-pro
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DEBUG
        value: False
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: airwatch-db
          property: connectionString
