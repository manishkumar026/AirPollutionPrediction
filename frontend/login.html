<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AirWatch Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div id="three-canvas-container"></div>

    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <i class="fas fa-wind"></i>
                <span>AirWatch Pro</span>
            </div>
            
            <div class="form-tabs">
                <button id="tab-login" class="active">Login</button>
                <button id="tab-register">Register</button>
            </div>

            <form id="login-form" class="auth-form active">
                <h2>Welcome Back</h2>
                <p>Sign in to monitor your air quality</p>
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="login-username" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="login-password" placeholder="Password" required>
                </div>
                <button type="submit" class="submit-btn">Login <i class="fas fa-arrow-right"></i></button>
            </form>

            <form id="register-form" class="auth-form">
                <h2>Create Account</h2>
                <p>Join AirWatch Pro for clean air insights</p>
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="reg-username" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="reg-password" placeholder="Password" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="reg-confirm" placeholder="Confirm Password" required>
                </div>
                <button type="submit" class="submit-btn">Register <i class="fas fa-user-plus"></i></button>
            </form>

            <div class="footer-links">
                <p>Protected by AirWatch Pro Security</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
